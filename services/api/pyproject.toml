[project]
name = "brickvault-api"
version = "0.0.0"
description = "BrickVault Appraisal App API; application source begins in Slice 1B."
requires-python = ">=3.13,<3.14"
dependencies = [
  "alembic==1.19.2",
  "fastapi==0.141.1",
  "psycopg[binary]==3.3.5",
  "pydantic==2.13.5",
  "pydantic-settings==2.15.0",
  "sqlalchemy==2.0.52",
  "uvicorn==0.52.4",
]

[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
  "hatchling==1.32.0",
  "httpx==0.28.1",
  "mypy==1.20.2",
  "pytest==9.1.1",
  "ruff==0.16.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/brickvault_api"]

[tool.uv]
required-version = "==0.12.10"
python-downloads = "never"
python-preference = "only-system"
# scripts/tasks.mjs supplies absolute repository-owned cache and environment paths.

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]
