services:
  postgres:
    image: docker.io/library/postgres:18.6-bookworm@sha256:1c59e2c3c818eaa0f0628f695b36e7c9e362d6b219b36a54a32df645cbd7e1af
    environment:
      POSTGRES_USER: brickvault_bootstrap
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${BVA_DATABASE_BOOTSTRAP_PASSWORD:?Use the guarded database helper}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --auth-local=scram-sha-256
    command:
      - postgres
      - -c
      - log_statement=none
      - -c
      - log_min_error_statement=panic
      - -c
      - log_parameter_max_length_on_error=0
    ports:
      - target: 5432
        published: ${BVA_DATABASE_PORT:?Use the guarded database helper}
        host_ip: 127.0.0.1
        protocol: tcp
    volumes:
      - data:/var/lib/postgresql
    labels:
      app.brickvault.owner: ${BVA_DATABASE_OWNER:?Use the guarded database helper}
    healthcheck:
      test: [CMD, pg_isready, -U, brickvault_bootstrap, -d, postgres]
      interval: 1s
      timeout: 2s
      retries: 30
    stop_grace_period: 10s
    restart: 'no'
volumes:
  data:
    labels:
      app.brickvault.owner: ${BVA_DATABASE_OWNER:?Use the guarded database helper}
networks:
  default:
    driver: bridge
    labels:
      app.brickvault.owner: ${BVA_DATABASE_OWNER:?Use the guarded database helper}
