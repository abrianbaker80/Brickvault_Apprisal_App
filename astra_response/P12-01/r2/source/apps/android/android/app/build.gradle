import groovy.json.JsonSlurper
apply plugin: 'com.android.application'

android {
    namespace = "com.abrianbaker.brickvault.appraisal"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.abrianbaker.brickvault.appraisal"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

// Opt-in debug-only localhost trust. Only a public X.509 certificate enters the APK.
// Ordinary debug/release resources contain system trust only. Never trust user CAs.
def qualificationCertificate = providers.gradleProperty('brickvaultQualificationCertificate')
if (qualificationCertificate.isPresent()) {
    def copiedConfig = file('src/main/assets/capacitor.config.json')
    if (copiedConfig.exists()) {
        def copiedServer = new JsonSlurper().parse(copiedConfig).server
        if (copiedServer?.hostname != 'localhost' || copiedServer?.url) {
            throw new GradleException('TEST certificate trust is forbidden for production Android')
        }
    }
    def generatedTrust = layout.buildDirectory.dir('generated/qualificationTrust')
    android.sourceSets.debug.res.srcDir(generatedTrust)
    def generateTrust = tasks.register('generateQualificationTrust') {
        inputs.file(qualificationCertificate)
        outputs.dir(generatedTrust)
        doLast {
            def source = file(qualificationCertificate.get())
            def pem = source.getText('UTF-8')
            if (!(pem.trim() ==~ /(?s)-----BEGIN CERTIFICATE-----[A-Za-z0-9+\/=\r\n]+-----END CERTIFICATE-----/)) {
                throw new GradleException('Qualification trust requires one public PEM certificate only')
            }
            def certificate = java.security.cert.CertificateFactory.getInstance('X.509')
                .generateCertificate(new ByteArrayInputStream(pem.getBytes('UTF-8')))
            certificate.checkValidity()
            def directory = generatedTrust.get().asFile
            new File(directory, 'raw').mkdirs()
            new File(directory, 'xml').mkdirs()
            new File(directory, 'raw/qualification_certificate.pem').text = pem
            new File(directory, 'xml/network_security_config.xml').text = '''<?xml version="1.0" encoding="utf-8"?>
<network-security-config>
    <base-config cleartextTrafficPermitted="false">
        <trust-anchors><certificates src="system" /></trust-anchors>
    </base-config>
    <domain-config cleartextTrafficPermitted="false">
        <domain includeSubdomains="false">localhost</domain>
        <trust-anchors><certificates src="@raw/qualification_certificate" /></trust-anchors>
    </domain-config>
</network-security-config>
'''
        }
    }
    tasks.named('preBuild').configure { dependsOn(generateTrust) }
}

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
